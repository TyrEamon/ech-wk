<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECH Workers</title>
  <link rel="icon" href="./app_icon.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-theme="dark">
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-globe" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="8.5"></circle>
      <path d="M3.9 9h16.2M3.9 15h16.2"></path>
      <path d="M12 3.5c2.2 2 3.5 5 3.5 8.5s-1.3 6.5-3.5 8.5c-2.2-2-3.5-5-3.5-8.5s1.3-6.5 3.5-8.5Z"></path>
    </symbol>
    <symbol id="icon-pencil" viewBox="0 0 24 24">
      <path d="m5 19 4.2-.9L18.4 8.9a2.1 2.1 0 0 0 0-3l-.3-.3a2.1 2.1 0 0 0-3 0L5.9 14.8 5 19Z"></path>
      <path d="m13.7 7 3.3 3.3"></path>
      <path d="M4 21h16"></path>
    </symbol>
    <symbol id="icon-bolt" viewBox="0 0 24 24">
      <path d="M13.2 2.8 5.7 13h5.8l-.7 8.2 7.5-10.5h-5.8l.7-7.9Z"></path>
    </symbol>
  </svg>

  <main class="stage">
    <section class="phone-shell" aria-label="ECH Workers">
      <header class="app-header">
        <div class="brand">
          <img class="brand-logo" src="./app_icon.png" alt="" aria-hidden="true">
          <strong>ECH Workers</strong>
        </div>
        <div class="header-actions">
          <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换日夜模式" aria-pressed="false">
            <span class="theme-knob"></span>
            <b data-theme-label>夜间</b>
          </button>
          <div class="status-chip" data-status-chip>
            <span></span>
            <strong data-status-text>未连接</strong>
          </div>
        </div>
      </header>

      <section class="viewport">
        <section class="page is-active" id="home" aria-label="首页">
          <div class="home-hero">
            <h1>Ech Connect</h1>

            <button class="power-tile" type="button" data-connect-button aria-pressed="false">
              <span class="icon icon-power" aria-hidden="true"></span>
              <span data-connect-label>点击连接</span>
            </button>

            <section class="selected-card">
              <button class="selected-node" type="button" data-node-picker aria-expanded="false">
                <span class="node-badge" aria-hidden="true">
                  <svg class="globe-svg"><use href="#icon-globe"></use></svg>
                </span>
                <span class="selected-copy">
                  <strong data-selected-node>默认服务器</strong>
                </span>
                <span class="icon icon-chevron chevron" aria-hidden="true"></span>
              </button>
              <div class="node-menu" data-node-menu></div>
            </section>

            <section class="route-mode" aria-label="代理模式">
              <div class="mode-options" role="group" aria-label="代理模式">
                <button type="button" data-mode-option="global">全局</button>
                <button class="is-active" type="button" data-mode-option="bypass_cn">绕过大陆</button>
                <button type="button" data-mode-option="none">不改变</button>
              </div>
            </section>
          </div>
        </section>

        <section class="page" id="proxies" aria-label="服务器管理">
          <div class="page-title">
            <h1>服务器管理</h1>
          </div>

          <div class="tool-row">
            <label class="search-box">
              <span class="icon icon-search" aria-hidden="true"></span>
              <input type="search" placeholder="搜索服务器..." aria-label="搜索服务器" data-search>
            </label>
            <button class="speed-button" type="button" data-speed-test>
              <svg class="bolt-svg" aria-hidden="true"><use href="#icon-bolt"></use></svg>
              测速
            </button>
          </div>

          <div class="server-groups" data-server-list></div>
          <button class="fab" type="button" data-new-server aria-label="新增服务器">+</button>
        </section>

        <section class="page config-page" id="config" aria-label="配置">
          <div class="config-top">
            <button class="back-button" type="button" data-back-proxies>
              <span class="icon icon-back" aria-hidden="true"></span>
              返回
            </button>
            <span>编辑</span>
          </div>

          <label class="server-select">
            <span>服务器</span>
            <select data-config-server></select>
          </label>

          <section class="form-panel">
            <h2>核心</h2>
            <label>
              <span>名称</span>
              <input data-config-name placeholder="服务器名称">
            </label>
            <label>
              <span>服务地址</span>
              <input data-config-address placeholder="服务器地址">
            </label>
            <label>
              <span>监听地址</span>
              <input data-config-listen placeholder="127.0.0.1:30000">
            </label>
            <label>
              <span>分流模式</span>
              <select data-config-routing>
                <option value="global">全局</option>
                <option value="bypass_cn">绕过大陆</option>
                <option value="none">不改变</option>
              </select>
            </label>
          </section>

          <section class="form-panel">
            <h2>高级</h2>
            <label>
              <span>身份令牌</span>
              <input data-config-token type="password" placeholder="可选">
            </label>
            <label>
              <span>优选 IP / 域名</span>
              <input data-config-ip placeholder="可选">
            </label>
            <label>
              <span>DoH 服务器</span>
              <input data-config-dns placeholder="dns.alidns.com/dns-query">
            </label>
            <label>
              <span>ECH 域名</span>
              <input data-config-ech placeholder="cloudflare-ech.com">
            </label>
          </section>

          <div class="config-actions">
            <button type="button" data-save-server>保存</button>
            <button class="delete" type="button" data-delete-server>删除</button>
          </div>
        </section>

        <section class="page" id="logs" aria-label="运行日志">
          <div class="logs-title">
            <div>
              <h1>运行日志</h1>
            </div>
            <button type="button" data-clear-logs>
              <span class="icon icon-trash" aria-hidden="true"></span>
              清空
            </button>
          </div>

          <section class="log-console">
            <div class="console-head">
              <strong>运行记录</strong>
            </div>
            <div class="console-body" data-terminal></div>
          </section>
        </section>
      </section>

      <nav class="bottom-nav" aria-label="底部导航">
        <button class="is-active" type="button" data-page-target="home">
          <span class="icon icon-home" aria-hidden="true"></span>
          <span>首页</span>
        </button>
        <button type="button" data-page-target="proxies">
          <span class="icon icon-stack" aria-hidden="true"></span>
          <span>服务器</span>
        </button>
        <button type="button" data-page-target="logs">
          <span class="icon icon-terminal" aria-hidden="true"></span>
          <span>日志</span>
        </button>
      </nav>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
